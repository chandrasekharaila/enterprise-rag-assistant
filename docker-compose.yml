version: "3.9"

services:
  api:
    build: .

    container_name: rag-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - qdrant

    volumes:
      - .:/app

  qdrant:
    image: qdrant/qdrant

    container_name: rag-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
